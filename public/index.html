<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Healthcare Assistant</h1>
            <p class="subtitle">General wellness guidance</p>

            <div class="top-buttons">
                <button id="themeToggle" class="theme-btn" type="button" aria-label="Toggle theme">Moon</button>
                <button id="clearChat" class="clear-btn" type="button" aria-label="Clear chat">Clear</button>
            </div>
        </div>

        <div id="healthCategories">
            <button class="categoryCard" type="button" data-question="I have symptoms. What could it be?">Symptoms</button>
            <button class="categoryCard" type="button" data-question="Give me sleep improvement tips">Sleep</button>
            <button class="categoryCard" type="button" data-question="How can I reduce stress?">Mental Health</button>
            <button class="categoryCard" type="button" data-question="Give me nutrition advice">Nutrition</button>
            <button class="categoryCard" type="button" data-question="Give me simple exercises to stay fit">Exercise</button>
            <button class="categoryCard" type="button" data-question="How much water should I drink daily?">Hydration</button>
        </div>

        <div id="chatbox"></div>

        <div class="input-area">
            <input id="inputBox" placeholder="Type your question..." />
            <button class="send-btn" type="button" id="sendButton">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
